name: Generate Snake

on:
  schedule:
    - cron: "0 0 * * *"   # daily at 00:00 UTC
  workflow_dispatch: {}
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Generate snake (dark, purple/green)
        uses: Platane/snk@v3
        id: snake-dark
        with:
          github_user_name: Kunalchandra007
          outputs: |
            dist/github-snake-dark.svg?palette=github-dark&color_snake=%23a855f7&color_dots=%23150a26,%233d2a5c,%237c3aed,%23a855f7,%2334d399

      - name: Generate snake (light)
        uses: Platane/snk@v3
        id: snake-light
        with:
          github_user_name: Kunalchandra007
          outputs: |
            dist/github-snake.svg?color_snake=%237c3aed&color_dots=%23eee8ff,%23d8c9f7,%23a855f7,%237c3aed,%2334d399

      - name: Push to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
