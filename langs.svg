      <animate attributeName="width" values="0;0;88.4" keyTimes="0;0.125;1" dur="1.6s" begin="0.1s" fill="freeze"/>
    </rect><rect x="108.4" y="36" width="0" height="10" fill="#3178C6">
      <animate attributeName="width" values="0;0;70.2" keyTimes="0;0.200;1" dur="1.6s" begin="0.1s" fill="freeze"/>
    </rect><rect x="178.6" y="36" width="0" height="10" fill="#b07219">
