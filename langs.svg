<svg xmlns="http://www.w3.org/2000/svg" width="300" height="195" viewBox="0 0 300 195">
  <defs>
    <clipPath id="rclangs"><rect x="0" y="0" width="300" height="195" rx="14"/></clipPath>
    <linearGradient id="bgglangs" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#000000"/><stop offset="100%" stop-color="#08150c"/>
    </linearGradient>
  </defs>
  <g clip-path="url(#rclangs)">
    <rect width="300" height="195" fill="url(#bgglangs)"/>
    <rect x="0.5" y="0.5" width="299" height="194" rx="14" fill="none" stroke="#34d399" stroke-width="1" opacity="0.5"/>
    
<text x="20" y="24" font-family="'Fira Code',monospace" font-size="13" font-weight="700" fill="#e8f5ec">Most Used Languages</text>
<rect x="20" y="36" width="260" height="10" rx="5" fill="#1e4d2b"/>
