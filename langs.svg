    </rect><rect x="228.0" y="36" width="0" height="10" fill="#f34b7d">
      <animate attributeName="width" values="0;0;31.2" keyTimes="0;0.350;1" dur="1.6s" begin="0.1s" fill="freeze"/>
    </rect><rect x="259.2" y="36" width="0" height="10" fill="#e34c26">
      <animate attributeName="width" values="0;0;20.8" keyTimes="0;0.425;1" dur="1.6s" begin="0.1s" fill="freeze"/>
    </rect></g>

    <g transform="translate(20,60)">
      <text x="0" y="4" font-family="'Fira Code',monospace" font-size="11" fill="#e8f5ec">Python</text>
      <text x="260" y="4" text-anchor="end" font-family="'Fira Code',monospace" font-size="10" fill="#7fae8f">34%</text>
    </g>
    <g transform="translate(20,82)">
      <text x="0" y="4" font-family="'Fira Code',monospace" font-size="11" fill="#e8f5ec">TypeScript</text>
      <text x="260" y="4" text-anchor="end" font-family="'Fira Code',monospace" font-size="10" fill="#7fae8f">27%</text>
    </g>
    <g transform="translate(20,104)">
      <text x="0" y="4" font-family="'Fira Code',monospace" font-size="11" fill="#e8f5ec">Java</text>
      <text x="260" y="4" text-anchor="end" font-family="'Fira Code',monospace" font-size="10" fill="#7fae8f">19%</text>
