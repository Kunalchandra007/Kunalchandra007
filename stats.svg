<svg xmlns="http://www.w3.org/2000/svg" width="440" height="195" viewBox="0 0 440 195">
  <defs>
    <clipPath id="rcstats"><rect x="0" y="0" width="440" height="195" rx="14"/></clipPath>
    <linearGradient id="bggstats" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#000000"/><stop offset="100%" stop-color="#08150c"/>
    </linearGradient>
  </defs>
  <g clip-path="url(#rcstats)">
    <rect width="440" height="195" fill="url(#bggstats)"/>
    <rect x="0.5" y="0.5" width="439" height="194" rx="14" fill="none" stroke="#34d399" stroke-width="1" opacity="0.5"/>
    
<defs><linearGradient id="ringGradS" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#34d399"/><stop offset="100%" stop-color="#a3e635"/></linearGradient></defs>
<text x="20" y="26" font-family="'Fira Code',monospace" font-size="13" font-weight="700" fill="#e8f5ec">Kunal Chandra&#39;s GitHub Stats</text>

<g transform="translate(70,97)">
  <circle r="46" fill="none" stroke="#1e4d2b" stroke-width="9"/>
  <circle r="46" fill="none" stroke="url(#ringGradS)" stroke-width="9" stroke-linecap="round"
    stroke-dasharray="251.3" stroke-dashoffset="251.3" transform="rotate(-90)">
    <animate attributeName="stroke-dashoffset" values="251.3;80.4" dur="1.8s" begin="0.2s" fill="freeze" calcMode="spline" keySplines="0.2 0 0.2 1"/>
  </circle>
  <text text-anchor="middle" y="-2" font-family="'Fira Code',monospace" font-size="20" font-weight="800" fill="#e8f5ec">A+</text>
  <text text-anchor="middle" y="16" font-family="'Fira Code',monospace" font-size="9" fill="#7fae8f">RANK</text>
</g>

    <g transform="translate(150,30)" opacity="0">
      <animate attributeName="opacity" values="0;0;1" keyTimes="0;0.136;1" dur="2.2s" begin="0s" fill="freeze"/>
      <animateTransform attributeName="transform" type="translate" values="180,30;180,30;150,30" keyTimes="0;0.136;1" dur="2.2s" begin="0s" fill="freeze" additive="sum"/>
      <circle cx="0" cy="0" r="3" fill="#34d399"/>
      <text x="12" y="4" font-family="'Fira Code',monospace" font-size="12.5" fill="#7fae8f">Total Repositories</text>
      <text x="260" y="4" text-anchor="end" font-family="'Fira Code',monospace" font-size="13" font-weight="700" fill="#34d399">55</text>
    </g>
    <g transform="translate(150,68)" opacity="0">
      <animate attributeName="opacity" values="0;0;1" keyTimes="0;0.205;1" dur="2.2s" begin="0s" fill="freeze"/>
      <animateTransform attributeName="transform" type="translate" values="180,68;180,68;150,68" keyTimes="0;0.205;1" dur="2.2s" begin="0s" fill="freeze" additive="sum"/>
      <circle cx="0" cy="0" r="3" fill="#a3e635"/>
      <text x="12" y="4" font-family="'Fira Code',monospace" font-size="12.5" fill="#7fae8f">Total Stars Earned</text>
      <text x="260" y="4" text-anchor="end" font-family="'Fira Code',monospace" font-size="13" font-weight="700" fill="#a3e635">15</text>
    </g>
    <g transform="translate(150,106)" opacity="0">
      <animate attributeName="opacity" values="0;0;1" keyTimes="0;0.273;1" dur="2.2s" begin="0s" fill="freeze"/>
      <animateTransform attributeName="transform" type="translate" values="180,106;180,106;150,106" keyTimes="0;0.273;1" dur="2.2s" begin="0s" fill="freeze" additive="sum"/>
      <circle cx="0" cy="0" r="3" fill="#34d399"/>
      <text x="12" y="4" font-family="'Fira Code',monospace" font-size="12.5" fill="#7fae8f">Followers</text>
      <text x="260" y="4" text-anchor="end" font-family="'Fira Code',monospace" font-size="13" font-weight="700" fill="#34d399">4</text>
    </g>
    <g transform="translate(150,144)" opacity="0">
      <animate attributeName="opacity" values="0;0;1" keyTimes="0;0.341;1" dur="2.2s" begin="0s" fill="freeze"/>
      <animateTransform attributeName="transform" type="translate" values="180,144;180,144;150,144" keyTimes="0;0.341;1" dur="2.2s" begin="0s" fill="freeze" additive="sum"/>
      <circle cx="0" cy="0" r="3" fill="#a3e635"/>
      <text x="12" y="4" font-family="'Fira Code',monospace" font-size="12.5" fill="#7fae8f">Pull Shark</text>
      <text x="260" y="4" text-anchor="end" font-family="'Fira Code',monospace" font-size="13" font-weight="700" fill="#a3e635">Achieved</text>
    </g>

  </g>
</svg>